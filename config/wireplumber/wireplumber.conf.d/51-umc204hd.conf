# Symlink this file to ~/.config/wireplumber/wireplumber.conf.d/ and restart
# WirePlumber to apply the custom rules. (see README.md for details)
monitor.alsa.rules = [
  # Rule for the card device
  {
    matches = [
      { device.name = "alsa_card.usb-BEHRINGER_UMC204HD_192k-00" }
    ]
    actions = {
      update-props = {
        device.nick = "UMC204HD (customized)"
      }
    }
  }
  # Rule for nodes (streams) from this device
  {
    matches = [
      { node.name = "~alsa_output.usb-BEHRINGER_UMC204HD_192k-00.*" }
      { node.name = "~alsa_input.usb-BEHRINGER_UMC204HD_192k-00.*" }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        api.alsa.period-size = 512
        api.alsa.headroom = 1024
        clock.name = "shared-pro-clock"
      }
    }
  }
]
