# Symlink this file to ~/.config/wireplumber/wireplumber.conf.d/ and restart
# WirePlumber to apply the custom rules. (see README.md for details)
monitor.alsa.rules = [
  # Rule for the card device
  {
    matches = [
      { device.name = "alsa_card.usb-Native_Instruments_Audio_8_DJ_SN-KNKYCDU9YU-00" }
    ]
    actions = {
      update-props = {
        device.nick = "Audio 8 DJ (customized)"
      }
    }
  }
  # Rule for nodes (streams) from this device
  {
    matches = [
      { node.name = "~alsa_output.usb-Native_Instruments_Audio_8_DJ_SN-KNKYCDU9YU-00.*" }
      { node.name = "~alsa_input.usb-Native_Instruments_Audio_8_DJ_SN-KNKYCDU9YU-00.*" }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        api.alsa.period-size = 512
        api.alsa.headroom = 1024
        clock.name = "shared-pro-clock"
      }
    }
  }
  # PipeWire's JACK layer uses node.description as the JACK client name, and
  # Mixxx (PortAudio) can't find the ports of a client with parentheses in its
  # name, so channel D output never shows up in Mixxx. Drop the "(Headphones)"
  # and "(Line/Mic)" suffixes.
  {
    matches = [
      { node.name = "alsa_output.usb-Native_Instruments_Audio_8_DJ_SN-KNKYCDU9YU-00.analog-stereo-d-output" }
    ]
    actions = {
      update-props = {
        node.description = "Audio 8 DJ Analog Stereo Channel D"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.usb-Native_Instruments_Audio_8_DJ_SN-KNKYCDU9YU-00.analog-stereo-c-input" }
    ]
    actions = {
      update-props = {
        node.description = "Audio 8 DJ Analog Stereo Channel C"
      }
    }
  }
]
